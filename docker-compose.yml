version: "3.8"

services:
  db:
    image: postgres:15
    container_name: task_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:latest
    container_name: task_mongo
    restart: always
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: .
    container_name: task_api
    restart: always
    depends_on:
      - db
      - mongo
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
  mongodata: